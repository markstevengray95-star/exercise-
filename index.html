<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photoreal Biomechanics</title>
<style>
html,body{height:100%;margin:0;background:#071018;color:#dbeafe;font-family:Inter,system-ui,sans-serif}
#loading{height:100%;display:grid;place-items:center;text-align:center}
small{color:#94a3b8}
</style>
</head>
<body>
<div id="loading"><div><strong>Loading Photoreal Biomechanics…</strong><br><small>Preparing anatomy textures and 3D scene</small></div></div>
<script>
(async () => {
  try {
    if (!('DecompressionStream' in window)) throw new Error('This browser does not support gzip decompression.');
    const paths = [1,2,3,4,5].map(n => `packed/part-${String(n).padStart(2,'0')}.txt`);
    const parts = await Promise.all(paths.map(p => fetch(p, {cache:'no-store'}).then(r => {
      if (!r.ok) throw new Error(`Could not load ${p}`);
      return r.text();
    })));
    const b64 = parts.join('').replace(/\s+/g,'');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    document.getElementById('loading').innerHTML =
      `<div><strong>App failed to load.</strong><br><small>${err.message}</small></div>`;
    console.error(err);
  }
})();
</script>
</body>
</html>
